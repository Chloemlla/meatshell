name: Release

# Build native packages for Windows / Linux / macOS.
#  - Push a tag like `v0.2.3`  -> builds all platforms and attaches the archives
#    to a GitHub Release.
#  - Push to `main`            -> real-time multi-platform CI build; on success
#    all archives are auto-released as a `v<version>-ci-<sha>` pre-release
#    (Project-Lumen style "Automatic release").
#  - Run manually (workflow_dispatch) -> builds all platforms and uploads them as
#    downloadable workflow artifacts (no release created).

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create / update the GitHub Release

jobs:
  check-version:
    name: Check tag version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure tag matches Cargo package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          LOCK_VERSION="$(awk '
            $0 == "name = \"meatshell\"" { found = 1; next }
            found && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.lock)"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}."
            echo "Run: pwsh ./scripts/release.ps1 ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$LOCK_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.lock meatshell version ${LOCK_VERSION}."
            echo "Run: pwsh ./scripts/release.ps1 ${GITHUB_REF_NAME}"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            bin: meatshell.exe
          - os: ubuntu-22.04            # build on the oldest supported runner for
            target: x86_64-unknown-linux-gnu   # broader glibc compatibility
            name: linux-x86_64
            bin: meatshell
          - os: ubuntu-22.04-arm       # free native arm64 runner (public repos)
            target: aarch64-unknown-linux-gnu  # builds the Linux ARM64 .tar.gz (#82)
            name: linux-aarch64
            bin: meatshell
          - os: macos-14               # Apple Silicon
            target: aarch64-apple-darwin
            name: macos-aarch64
            bin: meatshell
          - os: macos-14               # Cross-compile Intel Mac on Apple Silicon
            target: x86_64-apple-darwin
            name: macos-x86_64
            bin: meatshell
    steps:
      - uses: actions/checkout@v4

      # Slint (winit + femtovg) + rfd (GTK) + arboard need these system libs.
      # Build-time only — no GPU/display required to compile.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
          else
            EXPECTED="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          ACTUAL="$(target/${{ matrix.target }}/release/${{ matrix.bin }} --version)"
          test "$ACTUAL" = "meatshell ${EXPECTED}"

      - name: Restore AppImage tooling cache
        if: matrix.name == 'linux-x86_64'
        id: appimage-tools
        uses: actions/cache/restore@v4
        with:
          path: |
            linuxdeploy
            linuxdeploy-plugin-appimage
          key: linuxdeploy-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build AppImage
        if: matrix.name == 'linux-x86_64'
        continue-on-error: true           # don't block the .tar.gz if AppImage fails
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # no FUSE needed in CI
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          # Both upstreams publish under a moving `continuous` tag, so only fetch
          # what the restore step did not provide; bump the cache key above to
          # pull fresh builds. Downloads land on a temp name and are renamed only
          # on success, so a truncated transfer can neither be used as a tool in
          # this run nor get stored in the cache and silently reused later.
          [ -s linuxdeploy ] || { wget -q -O linuxdeploy.new \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage && mv linuxdeploy.new linuxdeploy; }
          [ -s linuxdeploy-plugin-appimage ] || { wget -q -O linuxdeploy-plugin-appimage.new \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage && mv linuxdeploy-plugin-appimage.new linuxdeploy-plugin-appimage; }
          chmod +x linuxdeploy linuxdeploy-plugin-appimage

          install -Dm755 target/${{ matrix.target }}/release/meatshell AppDir/usr/bin/meatshell
          install -Dm644 assets/meatshell.desktop          AppDir/usr/share/applications/meatshell.desktop
          install -Dm644 assets/icon@512.png               AppDir/usr/share/icons/hicolor/512x512/apps/meatshell.png

          # --output appimage already invokes the plugin; --plugin appimage is redundant and causes an error
          ./linuxdeploy --appdir AppDir --output appimage

          mv meatshell*.AppImage "meatshell-${VERSION}-linux-x86_64.AppImage"
          echo "APPIMAGE=meatshell-${VERSION}-linux-x86_64.AppImage" >> "$GITHUB_ENV"

      # Split from the restore above on purpose: the step that downloads these
      # is `continue-on-error`, and actions/cache's built-in save fails the job
      # when its paths do not exist — exactly the state a tolerated download
      # failure leaves behind. Save only what actually landed.
      - name: Save AppImage tooling cache
        if: matrix.name == 'linux-x86_64' && steps.appimage-tools.outputs.cache-hit != 'true' && hashFiles('linuxdeploy', 'linuxdeploy-plugin-appimage') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            linuxdeploy
            linuxdeploy-plugin-appimage
          key: linuxdeploy-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked

      - name: Build Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/meatshell target/release/meatshell
          cargo deb --no-build
          echo "DEB=$(find target/debian -name '*.deb' -print -quit)" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="meatshell-${VERSION}-${{ matrix.name }}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # ── Build a proper .app bundle ────────────────────────────────────
            # Without a bundle macOS opens raw binaries in Terminal.app, which
            # stays alive after the app exits and never shows a Dock icon.
            APP="meatshell.app"
            CONTENTS="$APP/Contents"
            mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

            cp "target/${{ matrix.target }}/release/meatshell" "$CONTENTS/MacOS/"
            cp THIRD_PARTY_NOTICES.md "$CONTENTS/Resources/"

            # Generate .icns from the 512×512 PNG using sips + iconutil (both
            # ship with every macOS, no extra tooling needed in CI).
            mkdir -p meatshell.iconset
            sips -z 16  16  "assets/icon@512.png" --out meatshell.iconset/icon_16x16.png       >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out meatshell.iconset/icon_16x16@2x.png    >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out meatshell.iconset/icon_32x32.png        >/dev/null
            sips -z 64  64  "assets/icon@512.png" --out meatshell.iconset/icon_32x32@2x.png    >/dev/null
            sips -z 128 128 "assets/icon@512.png" --out meatshell.iconset/icon_128x128.png     >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out meatshell.iconset/icon_128x128@2x.png  >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out meatshell.iconset/icon_256x256.png     >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out meatshell.iconset/icon_256x256@2x.png  >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out meatshell.iconset/icon_512x512.png     >/dev/null
            iconutil -c icns meatshell.iconset -o "$CONTENTS/Resources/meatshell.icns"

            # Substitute __VERSION__ placeholder (strip leading 'v' from tag)
            VERSION_NUM="${VERSION#v}"
            sed "s/__VERSION__/${VERSION_NUM}/g" assets/Info.plist > "$CONTENTS/Info.plist"

            # Ad-hoc code-sign the assembled bundle.
            # The release profile strips the binary (Cargo.toml: strip = "symbols"),
            # which invalidates the linker's automatic ad-hoc signature — on Apple
            # Silicon that makes the OS refuse to launch it ("app is damaged").
            # Re-signing the whole bundle here restores a valid (ad-hoc) signature,
            # turning the fatal "damaged" error into the normal "unidentified
            # developer" prompt that users can bypass via Open Anyway / xattr.
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose "$APP"

            # Package with ditto (Apple's tool) — it preserves the bundle's
            # signature and metadata. Plain `zip` mangles them and re-breaks the
            # signature, which would reintroduce the "damaged" error.
            ditto -c -k --keepParent "$APP" "${STAGE}.zip"
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          elif [ "${{ runner.os }}" = "Windows" ]; then
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            7z a "${STAGE}.zip" "$STAGE" >/dev/null
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          else
            # Linux
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            # Ship the desktop entry + installer + icon so the dock shows the icon.
            cp assets/meatshell.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi

      # MSI installer with a "choose install location" wizard (WixUI_InstallDir).
      # Best-effort: if the WiX/cargo-wix tooling hiccups it must not block the
      # .zip release, hence continue-on-error.
      - name: Build MSI installer (Windows)
        if: matrix.name == 'windows-x86_64'
        continue-on-error: true
        shell: pwsh
        run: |
          $VERSION = "$env:GITHUB_REF_NAME"; if (-not $VERSION) { $VERSION = "dev" }
          # WiX 3 toolset (candle/light) that cargo-wix drives.
          choco install wixtoolset -y --no-progress
          $candle = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($candle) { $env:PATH = "$($candle.DirectoryName);$env:PATH" }
          cargo install cargo-wix --locked
          cargo wix --no-build --nocapture --target ${{ matrix.target }} --output "meatshell-$VERSION-windows-x86_64.msi"
          echo "MSI=meatshell-$VERSION-windows-x86_64.msi" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Upload AppImage artifact
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-appimage
          path: ${{ env.APPIMAGE }}

      - name: Upload Debian package artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-deb
          path: ${{ env.DEB }}

      - name: Upload MSI artifact
        if: matrix.name == 'windows-x86_64' && env.MSI != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-msi
          path: ${{ env.MSI }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

      - name: Attach AppImage to GitHub Release
        if: matrix.name == 'linux-x86_64' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APPIMAGE }}
          fail_on_unmatched_files: true

      - name: Attach Debian package to GitHub Release
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DEB }}
          fail_on_unmatched_files: true

      - name: Attach MSI to GitHub Release
        if: matrix.name == 'windows-x86_64' && env.MSI != '' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MSI }}
          fail_on_unmatched_files: false

  build-flatpak:
    name: linux-x86_64-flatpak
    needs: [check-version, build]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86_64 package
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist

      - name: Restore prebuilt binary for Flatpak manifest
        shell: bash
        run: |
          set -eu
          tar -xzf dist/*.tar.gz -C dist
          BINARY="$(find dist -type f -name meatshell -perm -111 -print -quit)"
          test -n "$BINARY"
          install -Dm755 "$BINARY" target/x86_64-unknown-linux-gnu/release/meatshell

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        # No `cache-key` override on purpose: the action's default is
        # `flatpak-builder-<arch>-<sha256(manifest)>`, stable across commits,
        # with a `flatpak-builder-<arch>` restore-key fallback. Passing
        # `github.sha` here — as this job used to — minted a brand new key on
        # every push, and the fallback could not prefix-match it either, so the
        # ccache state in `.flatpak-builder` was never restored.
        with:
          bundle: meatshell-${{ github.ref_name }}-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.chloemlla.meatshell.yml

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-flatpak
          path: meatshell-${{ github.ref_name }}-linux-x86_64.flatpak

      - name: Attach Flatpak to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: meatshell-${{ github.ref_name }}-linux-x86_64.flatpak
          fail_on_unmatched_files: true

  build-linux-aarch64-glibc228:
    name: linux-aarch64-glibc228
    needs: check-version
    runs-on: ubuntu-22.04-arm
    container: debian:10

    steps:
      - name: Prepare Debian 10 build dependencies
        shell: bash
        run: |
          set -eu
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99archive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file tar \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu-glibc228

      - name: Build (release)
        shell: bash
        run: |
          set -eu
          . "$HOME/.cargo/env"
          rustc --version
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify glibc baseline
        shell: bash
        run: |
          set -eu
          ldd --version | sed -n '1p'
          file target/aarch64-unknown-linux-gnu/release/meatshell
          objdump -T target/aarch64-unknown-linux-gnu/release/meatshell \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -n 10 || true

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="meatshell-${VERSION}-linux-aarch64-glibc228"

          mkdir "$STAGE"
          cp "target/aarch64-unknown-linux-gnu/release/meatshell" "$STAGE/"
          cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
          cp assets/meatshell.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-glibc228
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

  build-linux-x86_64-glibc228:
    name: linux-x86_64-glibc228
    needs: check-version
    runs-on: ubuntu-22.04
    container: debian:10

    steps:
      - name: Prepare Debian 10 build dependencies
        shell: bash
        run: |
          set -eu
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99archive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file tar \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu-glibc228

      - name: Build (release)
        shell: bash
        run: |
          set -eu
          . "$HOME/.cargo/env"
          rustc --version
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Verify glibc baseline
        shell: bash
        run: |
          set -eu
          ldd --version | sed -n '1p'
          file target/x86_64-unknown-linux-gnu/release/meatshell
          objdump -T target/x86_64-unknown-linux-gnu/release/meatshell \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -n 10 || true

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="meatshell-${VERSION}-linux-x86_64-glibc228"

          mkdir "$STAGE"
          cp "target/x86_64-unknown-linux-gnu/release/meatshell" "$STAGE/"
          cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
          cp assets/meatshell.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-glibc228
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

  # CI-version real-time build auto-release (Project-Lumen "Automatic release"
  # pattern): after every successful push build, gather all platform archives and
  # publish them as a release at a `v<version>-ci-<short-sha>` tag. Tag pushes
  # keep their official release path; manual dispatches keep the artifact-only
  # behaviour. The CI release is not a pre-release and is marked as the
  # repository's "Latest" release.
  ci-release:
    name: ci-build-auto-release
    needs:
      - build
      - build-flatpak
      - build-linux-aarch64-glibc228
      - build-linux-x86_64-glibc228
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute CI release tag
        id: ci_tag
        shell: bash
        run: |
          set -eu
          VERSION="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "ci_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ci_short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "ci_tag=v${VERSION}-ci-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts

      - name: Flatten artifacts into release assets
        shell: bash
        run: |
          set -eu
          mkdir -p release-assets
          find ci-artifacts -type f -exec cp -n {} release-assets/ \;
          # Branch builds package as "meatshell-main-..."; relabel with the real
          # version so download names match the tag.
          cd release-assets
          for f in meatshell-main-*; do
            [ -e "$f" ] || continue
            mv "$f" "meatshell-${{ steps.ci_tag.outputs.ci_version }}-${f#meatshell-main-}"
          done
          echo "Assembled release assets:"
          ls -lh

      - name: Automatic release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.ci_tag.outputs.ci_tag }}
          name: "MeatShell ${{ steps.ci_tag.outputs.ci_version }} CI build ${{ steps.ci_tag.outputs.ci_short_sha }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/*
